# Suy luận ngược / phản thực (counterfactual) trên BN.
# Chỉ các biến NGƯỜI DÙNG ĐIỀU KHIỂN ĐƯỢC mới là "đòn bẩy". Thay đổi được mô hình hóa bằng can thiệp do()
# (cắt cạnh vào nút – graph surgery, Pearl 2009), không phải điều kiện hóa.
# direction: up = chỉ được tăng (theo thứ tự trạng thái), down = chỉ được giảm.
# max_steps: số bậc tối đa được thay đổi (ràng buộc thực tế). cost: chi phí mỗi bậc (GIẢ ĐỊNH – thể hiện độ khó).
levers:
  income:                {direction: up,   max_steps: 2, cost: 3.0, label: "Tăng thu nhập"}
  annuity_to_income:     {direction: down, max_steps: 3, cost: 1.0, label: "Giảm trả góp/thu nhập (vay ít hơn hoặc kỳ hạn dài hơn)"}
  credit_to_income:      {direction: down, max_steps: 3, cost: 1.0, label: "Giảm tổng dư nợ/thu nhập"}
  living_cost:           {direction: down, max_steps: 2, cost: 1.5, label: "Thắt chặt chi tiêu sinh hoạt"}
  bureau_inquiries_year: {direction: down, max_steps: 3, cost: 0.5, label: "Hạn chế mở tín dụng mới",
                          ordered_states: ["0", "1", "2-3", ">=4"]}
  # Đòn bẩy DÀI HẠN (cần thời gian, chi phí cao hơn): EDA cho thấy lịch sử tín dụng và ổn định việc làm
  # quyết định rủi ro mạnh hơn thu nhập/chi tiêu nhiều lần.
  ext_score_mean:        {direction: up,   max_steps: 2, cost: 4.0, horizon: long,
                          label: "Trả nợ đúng hạn liên tục ≥ 12 tháng để cải thiện lịch sử tín dụng"}
  years_employed:        {direction: up,   max_steps: 1, cost: 4.0, horizon: long,
                          label: "Gắn bó công việc hiện tại lâu hơn", ordered_states: ["<1", "1-3", "3-7", ">=7"]}
top_k: 5
